<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenSP — desktop themes</title><link rel="stylesheet" href="theme.css"><script src="theme.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font:17px/1.6 Arial,sans-serif}header,main{max-width:1500px;margin:auto;padding:24px 40px}header{display:flex;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line)}a{color:inherit;text-underline-offset:4px}header a{font-size:24px;font-weight:bold;text-decoration:none}h1{font-size:42px;font-weight:400;letter-spacing:-.04em;margin:24px 0 8px}p{max-width:65ch}nav{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0}button{padding:12px 18px;cursor:pointer;font:13px Consolas,monospace}.canvas{max-width:1200px;margin:auto;border:1px solid var(--line)}img{width:100%;height:auto;display:block}.caption{font:13px/1.6 Consolas,monospace;color:var(--muted);margin:20px 0 32px}@media(max-width:650px){header,main{padding:20px}h1{font-size:32px}}</style></head>
<body><header><a href="index.html">opensp</a><label class="theme-control">THEME <select data-theme-picker aria-label="Color theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label></header>
<main><h1>Desktop, in both lights.</h1><p>Same hierarchy, spacing and modular instrument. Compare each direction using the theme control. The OLED remains dark in both themes.</p>
<nav aria-label="Desktop study"><button data-study="a-field-manual" aria-pressed="true">A / Manual</button><button data-study="b-lab-journal" aria-pressed="false">B / Journal</button><button data-study="c-walkthrough" aria-pressed="false">C / Walkthrough</button><button data-study="d-components" aria-pressed="false">D / Components</button><button data-study="e-panel-parts" aria-pressed="false">E / Parts</button></nav>
<div class="canvas"><img id="study" src="a-field-manual.svg" data-light="a-field-manual.svg" data-dark="a-field-manual-dark.svg" width="1200" height="1500" alt="Desktop field manual layout"></div>
<p class="caption">DESIGN STUDY / <a href="responsive-pairs.svg">Desktop + mobile side by side</a> / <a href="desktop-themes.svg">All ten desktop sheets</a> / <a href="mobile.html">Responsive article preview</a></p></main>
<script>document.querySelectorAll('[data-study]').forEach(button=>button.onclick=()=>{const img=document.querySelector('#study');img.dataset.light=button.dataset.study+'.svg';img.dataset.dark=button.dataset.study+'-dark.svg';img.src=img.dataset[document.documentElement.dataset.theme||'light'];img.alt='Desktop '+button.textContent+' study';document.querySelectorAll('[data-study]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))});</script></body></html>
